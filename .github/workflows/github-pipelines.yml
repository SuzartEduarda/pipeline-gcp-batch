name: CI/CD Pipeline GCP Batch

on:
  schedule:
    # Execução diária às 03:00 BRT (06:00 UTC)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      execution_mode:
        description: 'Modo de Execução da Carga'
        required: true
        default: 'default'
        type: choice
        options:
          - default
          - incremental
          - backfill
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read
  id-token: write

jobs:
  # Validação de Pull Requests (sem necessidade de credenciais de nuvem)
  ci-validacao:
    name: "CI: Validação de Sintaxe e Dataform"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Validar Sintaxe e Importações Python
        run: |
          pip install -r requirements.txt
          python -c "import main, src.create_data, storage.storage, src.enrich_llm"

      - name: Validar Compilação do Dataform
        run: |
          npm install -g @dataform/cli
          cd dataform && dataform compile

  # Execução do Pipeline Lakehouse (Cron diário, Manual ou Push na Main)
  cd-execute-pipeline:
    name: "CD: Execução do Pipeline GCP Batch"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: dev
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      ENVIRONMENT: ${{ vars.ENVIRONMENT || 'dev' }}
      GCP_BRONZE_BUCKET: ${{ vars.GCP_BRONZE_BUCKET }}
      GCP_SA_EMAIL: ${{ secrets.GCP_SA_EMAIL }}
      GCP_WORKLOAD_PROVIDER: ${{ secrets.GCP_WORKLOAD_PROVIDER }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      VOLUMETRIA_INCREMENTAL: ${{ vars.VOLUMETRIA_INCREMENTAL || '100' }}
      VOLUMETRIA_BACKFILL: ${{ vars.VOLUMETRIA_BACKFILL || '500' }}
      INCREMENTAL_DAYS: ${{ vars.INCREMENTAL_DAYS || '3' }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-lite-latest' }}

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Autenticação Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_PROVIDER }}
          service_account: ${{ env.GCP_SA_EMAIL }}

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: pip install -r requirements.txt

      - name: Ingestão Batch (Faker -> GCS Bronze -> BigQuery Silver Raw)
        run: |
          MODE="${{ github.event.inputs.execution_mode || 'default' }}"
          if [ "$MODE" = "backfill" ]; then
            python main.py --backfill
          elif [ "$MODE" = "incremental" ]; then
            python main.py --incremental
          else
            python main.py
          fi

      - name: Higienização e Anonimização LGPD no BigQuery via Dataform (Silver)
        run: |
          npm install -g @dataform/cli
          cd dataform
          echo "{\"projectId\": \"${GCP_PROJECT_ID}\", \"location\": \"us-central1\"}" > .df-credentials.json
          dataform run --tags silver

      - name: Enriquecimento Semântico via Gemini (Google AI Studio Free Tier)
        if: env.GEMINI_API_KEY != ''
        run: python src/enrich_llm.py

      - name: Agregações e KPIs no BigQuery via Dataform (Gold & KPI)
        run: |
          cd dataform
          dataform run --tags gold,kpi
